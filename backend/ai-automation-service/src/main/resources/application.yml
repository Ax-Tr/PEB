spring:
  application:
    name: ai-automation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_automation_db}
    username: ${DB_USER:peb}
    password: ${DB_PASSWORD:peb}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ai-automation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/oauth2/jwks}

server:
  port: ${PORT:8100}
  shutdown: graceful

peb:
  outbox:
    relay:
      # This service emits AI_SUGGESTION_CREATED / ANOMALY_DETECTED via the transactional outbox.
      enabled: ${OUTBOX_RELAY_ENABLED:true}
  ai:
    # Governance thresholds read by AiAutomationService's ConfidencePolicy. Outputs at or above the
    # auto-apply threshold may be auto-applied (only for auto-applicable, non-statutory kinds);
    # outputs below the review threshold always require a human decision.
    auto-apply-threshold: ${AI_AUTO_APPLY_THRESHOLD:0.90}
    review-threshold: ${AI_REVIEW_THRESHOLD:0.50}
    commitment-uri: ${COMMITMENT_URI:http://localhost:8102}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3-flash-preview}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ai-automation-service
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui
