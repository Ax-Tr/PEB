spring:
  application:
    name: reconciliation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reconciliation_db}
    username: ${DB_USER:peb}
    password: ${DB_PASSWORD:peb}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: reconciliation
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/oauth2/jwks}

server:
  port: ${PORT:8095}
  shutdown: graceful

peb:
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}   # relay RECONCILIATION_MATCHED / RECONCILIATION_EXCEPTION_CREATED events

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: reconciliation-service
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui
