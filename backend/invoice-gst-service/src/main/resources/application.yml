spring:
  application:
    name: invoice-gst-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/invoice_db}
    username: ${DB_USER:peb}
    password: ${DB_PASSWORD:peb}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/oauth2/jwks}

server:
  port: ${PORT:8088}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: invoice-gst-service
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui

peb:
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}   # relay INVOICE_* events to Kafka
  invoice:
    default-state-code: "27"
    prefixes:
      tax-invoice: INV
      bill-of-supply: BOS
      receipt-voucher: RCV
      credit-note: CRN
      debit-note: DBN
