spring:
  application:
    name: payment-collection-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USER:peb}
    password: ${DB_PASSWORD:peb}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/oauth2/jwks}

server:
  port: ${PORT:8087}
  shutdown: graceful

peb:
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}   # relay PAYMENT_* events to Kafka
  payments:
    upi:
      default-vpa: ${UPI_DEFAULT_VPA:merchant@upi}
      default-name: ${UPI_DEFAULT_NAME:PayWithEase Merchant}
    link-base: ${PAYMENT_LINK_BASE:https://pay.paywithease.app/r/}
    default-provider: UPI
    request-expiry-minutes: 60
    # Provider webhook HMAC secrets. In production these come from Vault; the dev default lets the
    # local stack accept the sample gateway adapter's signed webhooks.
    webhook-secrets:
      UPI: ${WEBHOOK_SECRET_UPI:dev-webhook-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: payment-collection-service
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui
