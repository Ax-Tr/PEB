spring:
  application:
    name: payout-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payout_db}
    username: ${DB_USER:peb}
    password: ${DB_PASSWORD:peb}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/oauth2/jwks}

server:
  port: ${PORT:8091}
  shutdown: graceful

peb:
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}   # relay PAYOUT_* / VENDOR_PAYMENT_* events to Kafka
  payout:
    # Payouts above this amount (paise) require maker-checker approval + step-up auth.
    auto-approve-threshold-minor: ${PAYOUT_AUTO_APPROVE_THRESHOLD_MINOR:5000000}
    # A beneficiary verified/changed within this window is treated as high-risk.
    new-beneficiary-cooldown-hours: ${PAYOUT_NEW_BENEFICIARY_COOLDOWN_HOURS:24}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: payout-service
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui
