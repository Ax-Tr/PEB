spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/oauth2/jwks}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      routes:
        # ── identity-service (auth, RBAC, tenant/business, privacy) ──
        - id: identity-service
          uri: ${IDENTITY_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**,/api/v1/businesses/**,/api/v1/privacy/**,/api/v1/ping
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
            - name: CircuitBreaker
              args:
                name: identityCb
                fallbackUri: forward:/fallback/identity

        # ── business-service (customer, vendor, employee, product, invoice, purchase, commitment, notification, OCR, CA) ──
        - id: business-service
          uri: ${BUSINESS_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/customers/**,/api/v1/vendors/**,/api/v1/products/**,/api/v1/hsn-sac/**,/api/v1/employees/**,/api/v1/salary-runs/**,/api/v1/invoices/**,/api/v1/gst/**,/api/v1/purchase-bills/**,/api/v1/expenses/**,/api/v1/purchase-register/**,/api/v1/commitments/**,/api/v1/notifications/**,/api/v1/notification-templates/**,/api/v1/reminders/**,/api/v1/webhooks/notifications/**,/api/v1/documents/**,/api/v1/ocr/**,/api/v1/collaboration/**
          filters:
            - name: CircuitBreaker
              args:
                name: businessCb
                fallbackUri: forward:/fallback/business

        # ── finance-service (payment, payout, ledger, installment, ingestion, reconciliation, compliance, analytics, audit, AI) ──
        - id: finance-service
          uri: ${FINANCE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/payment-requests/**,/api/v1/payments/**,/api/v1/webhooks/payments/**,/api/v1/payouts/**,/api/v1/beneficiaries/**,/api/v1/chart-of-accounts/**,/api/v1/journals/**,/api/v1/ledgers/**,/api/v1/reports/**,/api/v1/periods/**,/api/v1/installments/**,/api/v1/bank-accounts/**,/api/v1/bank-transactions/**,/api/v1/cash-transactions/**,/api/v1/reconciliation/**,/api/v1/compliance/**,/api/v1/audit/**,/api/v1/ai/**
          filters:
            - name: CircuitBreaker
              args:
                name: financeCb
                fallbackUri: forward:/fallback/finance

        # ── analytics-service ──
        - id: analytics-service
          uri: ${ANALYTICS_URI:http://localhost:8097}
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - name: CircuitBreaker
              args:
                name: analyticsCb
                fallbackUri: forward:/fallback/analytics

      httpclient:
        connect-timeout: 2000
        response-timeout: 5s

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
