global:
  scrape_interval: 15s
  evaluation_interval: 15s

# SLO + launch-critical alert rules (see alerts.yml).
rule_files:
  - alerts.yml

# Alertmanager routes pages to on-call (configured per environment).
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'host.docker.internal:9093'   # alertmanager

scrape_configs:
  - job_name: 'peb-services'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'api-gateway:8080'
          - 'identity-service:8081'
          - 'business-service:8082'
          - 'finance-service:8083'
        labels:
          env: local

