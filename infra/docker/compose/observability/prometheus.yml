global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'peb-services'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'host.docker.internal:8080'   # api-gateway
          - 'host.docker.internal:8081'   # identity-service
        labels:
          env: local
