global:
  scrape_interval: 15s
  evaluation_interval: 15s

# SLO + launch-critical alert rules (see alerts.yml).
rule_files:
  - alerts.yml

# Alertmanager routes pages to on-call (configured per environment).
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'host.docker.internal:9093'   # alertmanager

scrape_configs:
  - job_name: 'peb-services'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'host.docker.internal:8080'   # api-gateway
          - 'host.docker.internal:8081'   # identity-service
          - 'host.docker.internal:8082'   # tenant-service
          - 'host.docker.internal:8083'   # customer-service
          - 'host.docker.internal:8084'   # vendor-service
          - 'host.docker.internal:8085'   # product-service
          - 'host.docker.internal:8086'   # employee-payroll-service
          - 'host.docker.internal:8087'   # payment-collection-service
          - 'host.docker.internal:8088'   # invoice-gst-service
          - 'host.docker.internal:8089'   # accounting-ledger-service
          - 'host.docker.internal:8090'   # purchase-expense-service
          - 'host.docker.internal:8091'   # payout-service
          - 'host.docker.internal:8092'   # installment-service
          - 'host.docker.internal:8093'   # notification-service
          - 'host.docker.internal:8094'   # transaction-ingestion-service
          - 'host.docker.internal:8095'   # reconciliation-service
          - 'host.docker.internal:8096'   # compliance-report-service
          - 'host.docker.internal:8097'   # analytics-service
          - 'host.docker.internal:8098'   # audit-evidence-service
          - 'host.docker.internal:8099'   # ca-collaboration-service
          - 'host.docker.internal:8100'   # ai-automation-service
          - 'host.docker.internal:8101'   # privacy-service
        labels:
          env: local
