# PEB local development stack — consolidated 4-service architecture.
# Usage: from repo root -> scripts/dev-up.sh   (or: docker compose -f infra/docker/compose/docker-compose.yml up -d)
name: peb-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peb
      POSTGRES_PASSWORD: peb
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/postgres-init.sh:/docker-entrypoint-initdb.d/10-init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redpanda = Kafka-API-compatible broker (lighter than full Kafka for local dev).
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: peb
      MINIO_ROOT_PASSWORD: peb-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Application services (consolidated 4-service architecture) ──

  api-gateway:
    build:
      context: ../../../backend
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      IDENTITY_URI: http://identity-service:8081
      BUSINESS_URI: http://business-service:8082
      FINANCE_URI: http://finance-service:8083
      ANALYTICS_URI: http://analytics-service:8097
      IDENTITY_JWKS_URI: http://identity-service:8081/oauth2/jwks
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  identity-service:
    build:
      context: ../../../backend
      dockerfile: identity-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USER: peb
      DB_PASSWORD: peb
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5

  business-service:
    build:
      context: ../../../backend
      dockerfile: business-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/business_db
      DB_USER: peb
      DB_PASSWORD: peb
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: redpanda:9092
      IDENTITY_JWKS_URI: http://identity-service:8081/oauth2/jwks
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: peb
      MINIO_SECRET_KEY: peb-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5

  finance-service:
    build:
      context: ../../../backend
      dockerfile: finance-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/finance_db
      DB_USER: peb
      DB_PASSWORD: peb
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: redpanda:9092
      IDENTITY_JWKS_URI: http://identity-service:8081/oauth2/jwks
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5

  analytics-service:
    build:
      context: ../../../backend
      dockerfile: analytics-service/Dockerfile
    ports:
      - "8097:8097"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/analytics_db
      DB_USER: peb
      DB_PASSWORD: peb
      KAFKA_BOOTSTRAP: redpanda:9092
      IDENTITY_JWKS_URI: http://identity-service:8081/oauth2/jwks
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8097/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5

  # --- Observability plane ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "3000:3000"

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"

volumes:
  pgdata:
  miniodata:
