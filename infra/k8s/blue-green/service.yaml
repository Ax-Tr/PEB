apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  # Cutover flips selector.color blue <-> green. Rollback = flip it back (seconds, traffic-only).
  selector:
    app: api-gateway
    color: blue
  ports:
    - name: http
      port: 80
      targetPort: 8080
