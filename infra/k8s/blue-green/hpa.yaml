apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-green
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway-green
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    # Scale on request latency (custom metric from Prometheus adapter) toward the P95 SLO.
    - type: Pods
      pods:
        metric:
          name: http_server_requests_p95_seconds
        target:
          type: AverageValue
          averageValue: "200m"   # 200ms
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
